[project]
name = "vehicle-data-hub"
version = "0.1.0"
description = "统一的车型数据下载工具：汽车之家配置 Excel + 工信部公告 PDF + 减免税目录"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
extend-exclude = ["downloads", "output", "logs", "data", ".browser"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]
