name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 项目仅支持 macOS（.doc 转换依赖 textutil / Word / LibreOffice），
    # 但 CI 跑的是离线单测，纯逻辑，ubuntu 足够且更快。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: lint
        run: python -m ruff check .
      - name: 单元测试
        run: python -m pytest
